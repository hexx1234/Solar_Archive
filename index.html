<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>SOLAR ARCHIVE — World Atlas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
:root{font-family:'DM Sans','Noto Sans KR',system-ui,sans-serif;color:#e8f4ff;background:#060d1c;--line:rgba(170,205,244,.22);--panel:rgba(11,24,48,.76);--muted:#9ab0ce;--accent:#8bc5ed}*{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit}button:focus-visible{outline:2px solid #a5ddff;outline-offset:4px}#app{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 52% 52%,#162a47 0%,#081326 47%,#050b19 100%);transition:background .7s}#app.circus{background:radial-gradient(ellipse at 50% 42%,#663645 0%,#311824 42%,#150c18 100%)}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 11% 21%,#c1dfff 90%,transparent),radial-gradient(1px 1px at 40% 52%,#fff 90%,transparent),radial-gradient(2px 2px at 70% 15%,#b4d7ff 90%,transparent),radial-gradient(1px 1px at 88% 69%,#e1eaff 90%,transparent),radial-gradient(1px 1px at 18% 84%,#fff 90%,transparent),radial-gradient(1px 1px at 60% 88%,#b8caff 90%,transparent),radial-gradient(1px 1px at 93% 32%,#fff 90%,transparent),radial-gradient(1px 1px at 28% 41%,#fff 90%,transparent);opacity:.6}.grain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(0,0,0,.018) 4px);opacity:.28}.topbar{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(22px,3.5vw,44px);gap:18px}.eyebrow{font-size:10px;letter-spacing:.28em;font-weight:700;color:#8caecc}.brand{font-size:clamp(19px,2.3vw,30px);letter-spacing:.13em;font-weight:600;margin-top:6px}.tagline{font-size:12px;color:#91a8c5;margin-top:7px}.world-switch,.pill,.close,.tab,.mini-btn{color:#e8f4ff;border:1px solid var(--line);background:rgba(25,48,78,.54);backdrop-filter:blur(16px);border-radius:999px;cursor:pointer;transition:background .2s,transform .2s}.world-switch{padding:13px 18px;display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}.world-switch:hover,.pill:hover,.tab:hover,.mini-btn:hover{background:rgba(67,103,141,.6)}.world-switch:active,.pill:active{transform:scale(.98)}.orbit-stage{position:relative;width:min(94vw,1080px);height:min(65vh,630px);min-height:390px;margin:-22px auto 0;display:flex;align-items:center;justify-content:center}.orbit{position:absolute;border:1px solid rgba(143,177,216,.19);border-radius:50%;width:var(--d);height:var(--d);pointer-events:none;box-shadow:0 0 0 1px rgba(30,67,111,.03)}.orbit:after{content:'';position:absolute;inset:-1px;border-radius:50%;border-top:1px solid rgba(193,222,255,.13);transform:rotate(25deg)}.sun-glow{position:absolute;width:104px;height:104px;background:#ffb445;border-radius:50%;filter:blur(42px);opacity:.32}.planet{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:90px;height:92px;border:0;background:none;color:#c4d7ef;cursor:pointer;z-index:2;transform:translate(-50%,-50%);touch-action:manipulation}.planet .sphere{border-radius:50%;display:block;width:var(--size);height:var(--size);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.62),var(--c) 43%,#111b2b 120%);box-shadow:inset -6px -7px 13px rgba(0,0,0,.4),0 0 17px color-mix(in srgb,var(--c) 38%,transparent);transition:transform .25s,box-shadow .25s}.planet:hover .sphere,.planet:focus-visible .sphere{transform:scale(1.16);box-shadow:inset -6px -7px 13px rgba(0,0,0,.3),0 0 25px color-mix(in srgb,var(--c) 75%,transparent)}.planet .planet-name{font-size:10px;letter-spacing:.08em;white-space:nowrap;text-shadow:0 2px 9px #000}.planet.sun .sphere{background:radial-gradient(circle at 35% 30%,#fff7c5 0%,#ffdb76 34%,#fca637 69%,#e17823 100%);box-shadow:0 0 35px #fd9e43a9,0 0 90px #f77c2644}.planet.saturn .sphere:after{content:'';display:block;position:relative;top:34%;left:-26%;height:25%;width:152%;border:3px solid #d9b989;border-radius:50%;transform:rotate(-25deg);box-shadow:0 0 5px #c5a87744}.side-meta{position:absolute;left:clamp(20px,3.5vw,44px);bottom:29px;color:#8ba3c5;font-size:10px;letter-spacing:.13em;z-index:3;line-height:1.9}.side-meta strong{font-weight:500;color:#c0d8f3}.bottom-nav{position:relative;z-index:5;display:flex;justify-content:center;gap:14px;margin:-5px auto 38px}.pill{display:flex;align-items:center;gap:12px;padding:15px 25px;font-size:12px;letter-spacing:.07em}.pill svg,.world-switch svg{width:17px;height:17px}.hint{position:relative;z-index:2;text-align:center;color:#7292b7;font-size:11px;letter-spacing:.12em;margin:0 0 18px}.view{position:relative;z-index:5;max-width:1050px;margin:10px auto 65px;padding:0 20px}.view-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.view h1{font-size:clamp(23px,4vw,38px);font-weight:500;margin:5px 0}.view h2{font-size:17px;font-weight:500}.view p{color:#b1c3da;line-height:1.85}.mini-btn{padding:10px 15px;font-size:12px}.file-card{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(20px);border-radius:18px;padding:clamp(18px,3vw,32px);box-shadow:0 18px 60px #0002}.person-header{display:grid;grid-template-columns:minmax(190px,40%) 1fr;gap:30px;align-items:stretch}.portrait{min-height:300px;border:1px solid #47638167;border-radius:12px;background:linear-gradient(160deg,#244369,#0b1c34);display:flex;justify-content:center;align-items:center;flex-direction:column;color:#8daac7;gap:12px}.portrait svg{width:64px;height:64px;opacity:.64}.portrait img{display:block;width:100%;height:100%;max-height:560px;object-fit:contain;object-position:center bottom}.portrait:has(img){background:linear-gradient(160deg,#244369,#0b1c34);padding:12px}.portrait .image-missing{font-size:12px;color:#b0c4db;text-align:center;line-height:1.8;padding:20px}.thumb img{width:100%;height:100%;object-fit:contain}.thumb:has(img){border-style:solid;background:#152b47;padding:7px;overflow:hidden}.details h2{font-size:32px;margin:20px 0 12px}.details dl{display:grid;grid-template-columns:90px 1fr;row-gap:18px;font-size:13px}.details dt{color:#8babc8}.details dd{margin:0;color:#e9f4ff}.rule{border:0;border-top:1px solid var(--line);margin:25px 0}.tabs{display:flex;gap:10px;margin:20px 0}.tab{padding:12px 18px;font-size:12px}.tab.active{background:rgba(99,148,194,.4);border-color:#96c8fa}.archive-placeholder{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.thumb{aspect-ratio:4/5;border:1px dashed #4a6887;border-radius:9px;display:grid;place-items:center;color:#8da8c7;background:#203b5b55;font-size:12px}.timeline{position:relative;padding-left:35px;margin-top:28px}.timeline:before{content:'';position:absolute;left:10px;top:12px;bottom:20px;border-left:1px solid #6a92c0}.event{position:relative;margin-bottom:16px}.event:before{content:'';position:absolute;left:-32px;top:22px;width:14px;height:14px;border-radius:50%;border:2px solid #92c0ef;background:#162e4a}.event button{display:block;text-align:left;width:100%;background:var(--panel);color:#e8f4ff;border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer}.event small{color:#89aacc;letter-spacing:.14em}.event strong{display:block;margin:7px 0;font-size:15px}.event p{margin:7px 0 0;font-size:13px}.relation-canvas{position:relative;min-height:350px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 50% 50%,#2342676b,#101f38);margin-bottom:20px}.relation-canvas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.relation-canvas .link-hit{cursor:pointer;stroke:transparent;stroke-width:23;fill:none;pointer-events:stroke}.relation-canvas .link-visual{stroke:#e3b782;stroke-width:2;stroke-dasharray:7 5}.face{position:absolute;top:50%;transform:translate(-50%,-50%);width:110px;height:110px;border:1px solid #7298bd;border-radius:50%;background:#243d5c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;z-index:2;color:white;font-size:13px;cursor:pointer}.face span{font-size:26px}.face.one{left:27%}.face.two{left:73%}.relation-caption{font-size:13px}.circus-stage{position:relative;width:min(91vw,950px);height:min(60vh,560px);min-height:390px;margin:15px auto 0;border-radius:45% 45% 16px 16px;background:radial-gradient(ellipse at 50% 90%,#9b61454d,#411b2f 60%,transparent 75%);border-bottom:2px solid #a37a65;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.circus-stage:before,.circus-stage:after{content:'';position:absolute;top:3%;bottom:0;width:24%;opacity:.47;background:repeating-linear-gradient(90deg,#9e4856 0 13px,#562335 13px 26px);filter:blur(1px)}.circus-stage:before{left:0;clip-path:polygon(0 0,100% 20%,65% 100%,0 100%)}.circus-stage:after{right:0;clip-path:polygon(0 20%,100% 0,100% 100%,35% 100%)}.circus-title{font-size:clamp(27px,6vw,65px);font-family:Georgia,serif;color:#efd0a5;letter-spacing:.1em;text-align:center;text-shadow:0 3px 25px #b15d4c;z-index:1}.circus-sub{font-size:11px;color:#e4bcab;letter-spacing:.3em;z-index:1}.performers{display:flex;gap:25px;z-index:1}.performer{cursor:pointer;color:#f9ead8;border:1px solid #c39c855e;background:#2b1625c9;padding:22px 28px;border-radius:15px;min-width:140px;display:flex;flex-direction:column;align-items:center;gap:10px}.performer b{font-weight:500}.performer:hover{background:#5c3144}.floating-admin{position:absolute;z-index:6;right:clamp(18px,3.5vw,44px);bottom:25px;color:#8fa9ca;display:flex;align-items:center;gap:8px;font-size:10px}.lock{display:inline-grid;place-items:center;border:1px solid var(--line);background:#1426408f;color:#c4daee;border-radius:50%;width:34px;height:34px}.notice{color:#8fabcb;font-size:12px;margin-top:20px}.back{margin-bottom:15px}.hidden{display:none!important}@media(max-width:680px){.topbar{padding:24px 17px}.world-switch{padding:11px 12px}.tagline{font-size:11px}.brand{font-size:19px}.orbit-stage{height:55vh;min-height:355px;width:100vw;margin:0 auto}.orbit{transform:scale(.76)}.planet{width:65px;height:76px}.planet .planet-name{font-size:9px}.planet .sphere{transform:scale(.8)}.planet:hover .sphere{transform:scale(.94)}.bottom-nav{margin:0 auto 30px;gap:8px;padding:0 18px}.pill{flex:1;justify-content:center;padding:13px 16px;gap:6px}.side-meta{display:none}.person-header{grid-template-columns:1fr;gap:16px}.portrait{min-height:300px}.details h2{margin-top:5px}.view{padding:0 16px}.file-card{padding:18px}.archive-placeholder{grid-template-columns:repeat(2,1fr)}.face{width:84px;height:84px}.face.one{left:24%}.face.two{left:76%}.circus-stage{min-height:350px}.performers{gap:9px}.performer{min-width:114px;padding:18px 12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="stars"></div><div class="grain"></div>
<header class="topbar"><div><div class="eyebrow">PERSONAL UNIVERSE DATABASE</div><div class="brand">SOLAR ARCHIVE</div><div class="tagline" id="worldTag">MAIN UNIVERSE · CELESTIAL MAP</div></div><button class="world-switch" id="worldBtn" aria-label="세계선 전환">⇄ <span id="worldLabel">AU 전환</span></button></header>
<main id="content"></main><footer class="floating-admin"><span>ADMIN ACCESS · 추후 연결</span><span class="lock" aria-hidden="true">⌘</span></footer>
</div>
<script>
// 기본 세계관의 캐릭터와 천체 연결. AU 정보는 별도로 관리합니다.
const assignments = {sun:'nova',moon:'lunetra'};
const objects=[{id:'sun',name:'태양',c:'#ffb553',size:44,angle:0,r:0},{id:'mercury',name:'수성',c:'#b4ada2',size:10,angle:27,r:48},{id:'venus',name:'금성',c:'#e0b67a',size:16,angle:198,r:82},{id:'earth',name:'지구',c:'#58a9e3',size:18,angle:315,r:120},{id:'moon',name:'달',c:'#cdd7e5',size:11,angle:315,r:120},{id:'mars',name:'화성',c:'#d47c60',size:14,angle:142,r:157},{id:'jupiter',name:'목성',c:'#d6b18c',size:32,angle:222,r:203},{id:'saturn',name:'토성',c:'#d9c39b',size:29,angle:294,r:246},{id:'uranus',name:'천왕성',c:'#a4d7d9',size:23,angle:55,r:291},{id:'neptune',name:'해왕성',c:'#678cde',size:22,angle:157,r:340}];
const characters={nova:{name:'노바',circusRole:'서커스 단장'},lunetra:{name:'루네트라',circusRole:'저글러'}};
// 이미지의 확장자를 몰라도 동일한 기본 파일명으로 찾아봅니다.
// GitHub 저장소에서 index.html과 같은 위치에 이미지를 업로드하세요.
const standingFiles={nova:'01SdStanding',lunetra:'02SdStanding'};
const imageExtensions=['.png','.PNG','.jpg','.JPG','.jpeg','.JPEG','.webp','.WEBP',''];
function standingMarkup(charId,heading){
  if(!standingFiles[charId]) return '<div class="image-missing">아직 등록된 일러스트가 없습니다.</div>';
  const base=standingFiles[charId];
  return `<img class="standing-art" data-image-base="${base}" data-image-step="0" src="${base}${imageExtensions[0]}" alt="${heading} 전신 일러스트" onerror="tryNextImage(this)"/>`;
}
function tryNextImage(img){
  const next=Number(img.dataset.imageStep||0)+1;
  if(next<imageExtensions.length){img.dataset.imageStep=String(next);img.src=img.dataset.imageBase+imageExtensions[next];return;}
  const base=img.dataset.imageBase;
  const wrapper=img.parentElement;
  img.remove();
  if(wrapper)wrapper.innerHTML=`<div class="image-missing">그림 파일을 찾지 못했어요.<br>${base}.png / .jpg / .webp 파일을<br>index.html 옆에 올려주세요.</div>`;
}

const state={world:'main',page:'home',selected:null,tab:'story'}; const content=document.querySelector('#content');const app=document.querySelector('#app');
const icons={network:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="5" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="19" r="2"/><path d="M7 6l10 0M6 7l5 10M18 8l-5 9"/></svg>',calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18"/></svg>'};
function navButtons(){return `<div class="bottom-nav"><button class="pill" data-page="relations">${icons.network} 관계도 <span style="opacity:.5">RELATIONS</span></button><button class="pill" data-page="timeline">${icons.calendar} 연대표 <span style="opacity:.5">TIMELINE</span></button></div>`}
function render(){app.classList.toggle('circus',state.world==='circus');document.querySelector('#worldTag').textContent=state.world==='main'?'MAIN UNIVERSE · CELESTIAL MAP':'ALTERNATE UNIVERSE · CIRCUS';document.querySelector('#worldLabel').textContent=state.world==='main'?'AU 전환':'기본 세계관';
if(state.page==='home'){renderHome()}else if(state.page==='character'){renderCharacter()}else if(state.page==='relations'){renderRelations()}else if(state.page==='timeline'){renderTimeline()} bind();}
function renderHome(){if(state.world==='circus'){content.innerHTML=`<section class="circus-stage"><div class="circus-sub">THE ALTERNATE WORLD</div><div class="circus-title">THE GRAND<br/>CIRCUS</div><div class="circus-sub">A STORY BETWEEN THE CURTAINS</div><div class="performers"><button class="performer" data-char="nova"><span style="font-size:30px">✦</span><b>노바</b><small>DIRECTOR</small></button><button class="performer" data-char="lunetra"><span style="font-size:30px">☾</span><b>루네트라</b><small>JUGGLER</small></button></div></section>${navButtons()}<p class="hint">SELECT A CHARACTER TO OPEN A FILE</p>`;return}
let orbits=[48,82,120,157,203,246,291,340].map(r=>`<div class="orbit" style="--d:${r*2}px"></div>`).join('');let planets=objects.map(o=>{const theta=o.angle*Math.PI/180;const x=Math.cos(theta)*o.r+(o.id==='moon'?27:0);const y=Math.sin(theta)*o.r*.72+(o.id==='moon'?-21:0);return `<button class="planet ${o.id}" data-object="${o.id}" style="left:calc(50% + ${x}px);top:calc(50% + ${y}px);--c:${o.c};--size:${o.size}px" title="${o.name} 기록 열기"><span class="sphere"></span><span class="planet-name">${o.name}</span></button>`}).join('');content.innerHTML=`<section class="orbit-stage" aria-label="태양계 천체 선택 화면">${orbits}<div class="sun-glow"></div>${planets}<div class="side-meta">OBSERVATION STATUS<br/><strong>CELESTIAL INDEX 10 / ACTIVE</strong><br/>CHOOSE AN OBJECT</div></section>${navButtons()}<p class="hint">SELECT A CELESTIAL BODY TO EXPLORE</p>`}
function openCharacter(id){state.selected=id;state.tab='story';state.page='character';render()}
function renderCharacter(){const isCircus=state.world==='circus';const obj=objects.find(o=>o.id===state.selected);const charId=isCircus?state.selected:assignments[state.selected];const char=charId?characters[charId]:null;const heading=char?char.name:(obj?obj.name:'인물 기록'); const text=char?(isCircus&&charId==='lunetra'?'어린 시절 서커스단과 인연을 맺고 저글러로 성장하는 루네트라의 서사가 여기에 들어갑니다.':isCircus&&charId==='nova'?'서커스단의 단장 노바에 대한 서사를 이곳에 작성합니다.':'캐릭터 개인 서사를 이곳에 작성합니다.'):'이 천체에 연결된 캐릭터가 아직 등록되지 않았습니다. 나중에 assignments 데이터에서 연결할 수 있어요.';
content.innerHTML=`<section class="view"><div class="view-header"><div><div class="eyebrow">ARCHIVE / PERSONNEL FILE</div><h1>인물 기록</h1></div><button class="mini-btn" data-page="home">← 돌아가기</button></div><article class="file-card"><div class="person-header"><div class="portrait">${standingMarkup(charId,heading)}</div><div class="details"><div class="eyebrow">FILE / ${isCircus?'CIRCUS':(obj?.id||'UNKNOWN').toUpperCase()}</div><h2>${heading}</h2><dl><dt>연관 천체</dt><dd>${isCircus?'AU 개별 설정':obj?.name||'미지정'}</dd><dt>성별</dt><dd>미입력</dd><dt>나이</dt><dd>미입력</dd><dt>역할</dt><dd>${isCircus?(char?.circusRole||'미입력'):'미입력'}</dd><dt>상태</dt><dd>${char?'서사 등록 준비':'캐릭터 연결 대기'}</dd></dl></div></div><hr class="rule"/><div class="eyebrow">PERSONAL RECORD</div><div class="tabs"><button class="tab ${state.tab==='story'?'active':''}" data-tab="story">개인 서사</button><button class="tab ${state.tab==='gallery'?'active':''}" data-tab="gallery">이미지 아카이브</button></div><div id="tabContent">${state.tab==='story'?`<h2>PERSONAL HISTORY</h2><p>${text}</p>`:`<h2>IMAGE ARCHIVE</h2><div class="archive-placeholder"><div class="thumb">${standingMarkup(charId,heading)}</div><div class="thumb">IMAGE 02</div><div class="thumb">IMAGE 03</div></div>`}</div></article><p class="notice">※ 전신 일러스트는 01SdStanding(노바), 02SdStanding(루네트라) 파일을 자동으로 불러옵니다. 기타 설정과 갤러리는 계속 편집할 수 있습니다.</p></section>`}
function renderRelations(){content.innerHTML=`<section class="view"><div class="view-header"><div><div class="eyebrow">${state.world==='main'?'MAIN WORLD':'CIRCUS AU'} / NETWORK</div><h1>관계도</h1></div><button class="mini-btn" data-page="home">← 돌아가기</button></div><div class="relation-canvas"><svg viewBox="0 0 600 350" preserveAspectRatio="none"><line class="link-visual" x1="162" y1="175" x2="438" y2="175"/><line class="link-hit" data-relation="pair" x1="162" y1="175" x2="438" y2="175"/></svg><button class="face one" data-char="nova"><span>✦</span>노바</button><button class="face two" data-char="lunetra"><span>☾</span>루네트라</button></div><div class="file-card"><div class="eyebrow">RELATIONSHIP FILE</div><h2>노바 ↔ 루네트라</h2><p class="relation-caption">${state.world==='circus'?'서커스단 AU에서는 노바가 단장이고 루네트라는 단원입니다. 이곳에 서로에 대한 생각과 공동 서사를 기록할 예정이에요.':'기본 세계관의 두 캐릭터가 서로를 어떻게 생각하는지, 관계가 어떻게 변해 왔는지 기록할 공간입니다.'}</p><p class="notice">연결선을 선택하면 이 관계 파일이 열리도록 연결했습니다. 실제 얼굴 그림은 추후 업로드할 수 있어요.</p></div></section>`}
function renderTimeline(){const au=state.world==='circus';const entries=au?[['01','첫 만남','어린 루네트라가 서커스단의 물건을 치우는 일을 맡으면서 노바를 만납니다.'],['02','저글링의 재능','노바는 루네트라에게 저글링을 권하고, 그녀의 재능을 발견합니다.'],['03','그 이후','이후의 이야기는 아직 등록되지 않았습니다.']]:[['01','세계관의 시작','기본 세계관의 첫 사건을 기록할 공간입니다.'],['02','중요 사건','이곳에 관련 인물과 사건의 전개를 적을 수 있습니다.'],['03','현재 시점','현재 세계관의 상황을 기록할 공간입니다.']];content.innerHTML=`<section class="view"><div class="view-header"><div><div class="eyebrow">${au?'CIRCUS AU':'MAIN WORLD'} / CHRONICLE</div><h1>세계관 연대표</h1></div><button class="mini-btn" data-page="home">← 돌아가기</button></div><p>사건을 선택하면 상세 기록이 펼쳐지는 세로형 연대표입니다.</p><div class="timeline">${entries.map(([index,title,description],i)=>`<div class="event"><button data-event="${i}" aria-expanded="${i===0}"><small>RECORD ${index}</small><strong>${title}</strong><p class="${i===0?'':'hidden'}" id="event-${i}">${description}</p></button></div>`).join('')}</div></section>`}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;render()}));document.querySelectorAll('[data-object]').forEach(b=>b.addEventListener('click',()=>openCharacter(b.dataset.object)));document.querySelectorAll('[data-char]').forEach(b=>b.addEventListener('click',()=>openCharacter(b.dataset.char)));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render()}));document.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>{const p=document.querySelector('#event-'+b.dataset.event);const hidden=p.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!hidden))}));document.querySelectorAll('[data-relation]').forEach(b=>b.addEventListener('click',()=>document.querySelector('.relation-caption')?.scrollIntoView({behavior:'smooth',block:'center'})))}
document.querySelector('#worldBtn').addEventListener('click',()=>{state.world=state.world==='main'?'circus':'main';state.page='home';state.tab='story';render()});render();
</script>
</body>
</html>
